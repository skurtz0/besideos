    <h1>BesideOS</h1>
    <p>Install another operating system beside the one you are running, without a USB stick.</p>
    <p>BesideOS downloads the official ISO from the distribution's own servers, verifies its SHA-256 checksum,
    makes room on your disk and sets up a one-time boot entry. Nothing changes until you confirm, and you can undo it.
    Desktop apps for Windows (.exe) and Linux (.deb, .rpm, .pkg.tar.zst). Free and open source (MIT).</p>
