name: Release

# Push a tag like v0.2.0 (after bumping `version:` in pubspec.yaml and kAppVersion in lib/update_check.dart).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches pubspec.yaml and kAppVersion
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^version: $v\(+\|$\)" pubspec.yaml || { echo "pubspec.yaml version is not $v"; exit 1; }
          grep -q "kAppVersion = '$v'" lib/update_check.dart || { echo "kAppVersion is not $v"; exit 1; }

  windows:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: powershell -NoProfile -File tool/build_windows.ps1
      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $src = (Resolve-Path build/windows/x64/runner/Release).Path
          & $iscc "/DAppVersion=$ver" "/DSourceDir=$src" tool/installer/besideos.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: build/installer/BesideOS-Setup.exe }

  linux:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev zstd rpm ruby
          sudo gem install fpm --no-document
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: bash tool/build_linux.sh
      - run: bash tool/package_deb.sh
      - run: bash tool/package_rpm_arch.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            build/besideos-linux-amd64.deb
            build/besideos-linux-x86_64.rpm
            build/besideos-linux-x86_64.pkg.tar.zst

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "BesideOS $GITHUB_REF_NAME" --generate-notes
