name: Update ISO catalog

# Every Monday (and by hand): look up the newest official ISOs, verify the links and open a pull request.
# A dead link that cannot be refreshed fails this run, so it shows up as a red check instead of a broken download.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Look up new releases and verify every ISO link
        run: python3 tool/update_catalog.py
      - run: python3 tool/build_llms_full.py
      - run: python3 tool/build_seo_pages.py
      # Pull requests opened with the default token do not start CI, so the checks run here instead.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - uses: peter-evans/create-pull-request@v7
        id: cpr
        with:
          branch: bot/update-iso-catalog
          commit-message: 'Catalog: update ISO links to the newest official releases'
          title: 'Catalog: update ISO links'
          body: 'Automatic weekly update by `tool/update_catalog.py`. Every link was checked with an HTTP HEAD request.'
          add-paths: |
            assets/catalog/catalog.json
            web/llms-full.txt
            web/distros
            web/sitemap.xml
      # analyze and test above already passed, so merge at once. A push made with the default token does not start
      # other workflows, so start the site deploy by hand (otherwise installed apps never see the new catalog).
      - name: Merge and deploy
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --squash --delete-branch --repo "$GITHUB_REPOSITORY"
          gh workflow run deploy-web.yml --ref main --repo "$GITHUB_REPOSITORY"
