name: Deploy site to Cloudflare Pages

# Builds the web site and the Windows installer and the Linux package, then publishes both to Cloudflare Pages.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account id
# Runs on every push to main once both secrets exist; can also be started by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  windows-app:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: powershell -NoProfile -File tool/build_windows.ps1
      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $src = (Resolve-Path build/windows/x64/runner/Release).Path
          & $iscc "/DAppVersion=$ver" "/DSourceDir=$src" tool/installer/besideos.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: build/installer/BesideOS-Setup.exe
          if-no-files-found: error

  linux-app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: bash tool/build_linux.sh
      - run: bash tool/package_deb.sh
      - name: Package .rpm and Arch .pkg.tar.zst
        run: |
          sudo apt-get install -y ruby rpm zstd
          sudo gem install fpm --no-document
          bash tool/package_rpm_arch.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: |
            build/besideos-linux-amd64.deb
            build/besideos-linux-x86_64.rpm
            build/besideos-linux-x86_64.pkg.tar.zst
          if-no-files-found: error

  deploy:
    needs: [windows-app, linux-app]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT: besideos
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run tool/build_l10n.dart
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn

      - uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: build/web
      - uses: actions/download-artifact@v4
        with:
          name: linux-app
          path: build/web

      - name: Trim files the site does not use (Pages allows 25 MiB per file)
        run: |
          rm -f build/web/canvaskit/skwasm* build/web/canvaskit/wimp* build/web/*.symbols
          ls -la build/web/BesideOS-Setup.exe build/web/besideos-linux-amd64.deb
          [ "$(head -c2 build/web/BesideOS-Setup.exe)" = "MZ" ]
          dpkg-deb --info build/web/besideos-linux-amd64.deb > /dev/null
          ls -la build/web/besideos-linux-x86_64.rpm build/web/besideos-linux-x86_64.pkg.tar.zst

      - name: Publish
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=${{ env.PROJECT }} --branch=main

      - name: Skipped
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "Cloudflare secrets are not set, build only (no publish)."
