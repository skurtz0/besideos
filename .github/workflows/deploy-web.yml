name: Deploy site to Cloudflare Pages

# Builds the web site and the Windows app package, then publishes both to Cloudflare Pages.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account id
# Runs on every push to main once both secrets exist; can also be started by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  windows-app:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: powershell -NoProfile -File tool/build_windows.ps1
      - name: Zip the app (BesideOS/ prefix, forward-slash entries)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path stage/BesideOS | Out-Null
          Copy-Item -Recurse -Force build/windows/x64/runner/Release/* stage/BesideOS/
          Compress-Archive -Path stage/BesideOS -DestinationPath BesideOS-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: BesideOS-windows.zip
          if-no-files-found: error

  deploy:
    needs: windows-app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT: besideos
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run tool/build_l10n.dart
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn

      - uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: build/web

      - name: Trim files the site does not use (Pages allows 25 MiB per file)
        run: |
          rm -f build/web/canvaskit/skwasm* build/web/canvaskit/wimp* build/web/*.symbols
          ls -la build/web/BesideOS-windows.zip
          unzip -tq build/web/BesideOS-windows.zip

      - name: Publish
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=${{ env.PROJECT }} --branch=main

      - name: Skipped
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "Cloudflare secrets are not set, build only (no publish)."
