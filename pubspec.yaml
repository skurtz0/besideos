name: besideos_site
description: The besideos.com website, built with Flutter web.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  analyzer: ^14.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/catalog/
    - assets/screens/
    - assets/l10n/
  fonts:
    - family: M23HydrantSpecial
      fonts:
        - asset: assets/fonts/M23_HYDRANT_SPECIAL.ttf
